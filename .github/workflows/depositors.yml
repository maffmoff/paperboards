# Re-indexes Papertrade deposits on a schedule and publishes site/ to GitHub Pages.
# Enable Pages with "Source: GitHub Actions" in the repository settings once.
name: depositors

on:
  schedule:
    - cron: "*/10 * * * *"   # backstop only: GitHub delays schedules by hours on young repos, so the
                             # "next" job below chains runs ~10 min apart; a schedule run restarts the chain if it breaks
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write   # the "next" job dispatches the following run

concurrency:
  group: depositors-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The checkpoint keeps every decoded event; restoring it turns each run into a
      # small incremental scan. If the cache is lost the run rescans from genesis (~5 min).
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/depositors/checkpoint.json
            data/summary.jsonl
          key: depositors-checkpoint-${{ github.run_id }}
          restore-keys: depositors-checkpoint-

      - run: npm run depositors:index
        env:
          PAPERTRADE_RPCS: ${{ vars.PAPERTRADE_RPCS }}   # optional: comma-separated RPC endpoints

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            data/depositors/checkpoint.json
            data/summary.jsonl
          key: depositors-checkpoint-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Starts the following run ~10 min after this one began. workflow_dispatch is the one event the
  # built-in GITHUB_TOKEN may trigger, so no personal token is needed. Runs share the concurrency
  # group above, so a duplicate chain only ever queues one pending run and the extra is cancelled.
  # Disable the workflow (gh workflow disable depositors.yml) to stop the chain.
  next:
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Wait until 10 minutes after this run started, then dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          started=$(gh run view ${{ github.run_id }} --json createdAt -q .createdAt)
          wait=$(( 600 - ( $(date +%s) - $(date -d "$started" +%s) ) ))
          if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          gh workflow run depositors.yml --ref ${{ github.ref_name }}
